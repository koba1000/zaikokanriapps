{% extends "base.html" %}
{% from "_forms.html" import field %}
{% block content %}
<h1>従業員</h1>
<p>住所は暗号化して保存され、詳細画面を開くと監査ログに記録されます。</p>
<ul>{% for e in employees %}<li><a href="{{ url_for('admin.employee_detail', employee_id=e.id) }}">{{ e.name }}</a></li>{% endfor %}</ul>
<h2>追加</h2>
<form method="post">
  {{ form.hidden_tag() }}{{ field(form.name) }}{{ field(form.address) }}<button>登録</button>
</form>
{% endblock %}

{% extends "base.html" %}
{% from "_forms.html" import field %}
{% block title %}ログイン{% endblock %}
{% block content %}
<h1>ログイン</h1>
<form method="post" autocomplete="off">
  {{ form.hidden_tag() }}
  {{ field(form.username, autocomplete="username") }}
  {{ field(form.password, autocomplete="current-password") }}
  <button>ログイン</button>
</form>
{% endblock %}

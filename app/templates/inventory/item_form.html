{% extends "base.html" %}
{% from "_forms.html" import field %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">
  {{ form.hidden_tag() }}
  {{ field(form.name) }}{{ field(form.unit) }}{{ field(form.quantity) }}
  {{ field(form.reorder_point) }}{{ field(form.order_quantity) }}{{ field(form.supplier) }}
  <button>保存</button>
</form>
{% endblock %}
